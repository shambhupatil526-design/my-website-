
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KADAM DIGITAL | Shop Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body.auth-locked .app {
      display: none !important;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg,#101b35,#1e3a68,#3676bd);
      font-family: Inter, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px #0005;
    }

    .login-card h2 {
      text-align: center;
      color: #172b4d;
      margin: 0 0 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .login-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .login-tabs button {
      flex: 1;
      padding: 12px 8px;
      border: 1px solid #dce4ef;
      border-radius: 9px;
      background: #f4f7fb;
      color: #344563;
      font-weight: 700;
      cursor: pointer;
    }

    .login-tabs button.active {
      background: #1e4f91;
      color: white;
      border-color: #1e4f91;
    }

    .login-card label {
      display: block;
      margin: 14px 0 7px;
      color: #344563;
      font-size: 13px;
      font-weight: 700;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d8e0eb;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .login-card input:focus {
      border-color: #3478c5;
    }

    .login-submit {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      color: white;
      background: linear-gradient(135deg,#174a87,#347bc5);
      font-weight: 700;
      cursor: pointer;
    }

    .login-submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    .login-error {
      color: #d62828;
      font-size: 13px;
      text-align: center;
      margin-top: 13px;
      min-height: 18px;
    }

    .login-brand {
      text-align: center;
      font-weight: 800;
      color: #1e4f91;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .auth-actions button {
      border: 1px solid #dce4ef;
      background: white;
      color: #23466f;
      padding: 8px 11px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }

    .auth-actions button.logout {
      background: #fff1f1;
      color: #c62828;
      border-color: #f3cccc;
    }

    @media(max-width:480px) {
      .login-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body class="auth-locked">

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">

    <div class="login-card">

      <div class="login-brand">KADAM DIGITAL</div>

      <h2>Welcome Back</h2>

      <div class="login-subtitle">
        Printing Business Management System
      </div>

      <div class="login-tabs">

        <button
          type="button"
          class="active"
          data-role="admin">
          Admin Login
        </button>

        <button
          type="button"
          data-role="executive">
          Executive Login
        </button>

      </div>

      <form id="loginForm">

        <label>Username</label>

        <input
          id="loginUsername"
          type="text"
          placeholder="Enter username"
          required
          autocomplete="username"
        >

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        >

        <button
          class="login-submit"
          id="loginSubmit"
          type="submit">
          Login to Dashboard
        </button>

        <div
          class="login-error"
          id="loginError">
        </div>

      </form>

    </div>

  </div>


  <!-- MAIN APPLICATION -->
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">

        <div class="brand-icon">P</div>

        <div>
          <h2>KADAM DIGITAL</h2>
          <small>SHOP MANAGEMENT</small>
        </div>

      </div>

      <div class="menu-label">MAIN MENU</div>

      <nav>

        <a href="#" data-page="dashboard" class="active">
          ▦ <span>Dashboard</span>
        </a>

        <a href="#" data-page="banner">
          ▣ <span>New Banner Order</span>
        </a>

        <a href="#" data-page="jobwork">
          ▤ <span>Job Work</span>
        </a>

        <a href="#" data-page="customers">
          ♙ <span>Customers</span>
        </a>

        <a href="#" data-page="payments">
          ₹ <span>Payments</span>
        </a>

        <a href="#" data-page="expenses">
          ↗ <span>Expenses</span>
        </a>

        <a href="#" data-page="orders">
          ☷ <span>All Orders</span>
        </a>

        <a href="#" data-page="reports">
          ▥ <span>Monthly Reports</span>
        </a>

      </nav>

      <div class="sidebar-bottom">

        <div class="side-note">
          KADAM DIGITAL<br>
          <small>Smart Printing Business Manager</small>
        </div>

      </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main">

      <header class="topbar">

        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Your business at a glance</p>
        </div>

        <div class="top-date" id="todayDate"></div>

      </header>

      <section id="pageContent"></section>

    </main>

  </div>


  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- MAIN APPLICATION JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
